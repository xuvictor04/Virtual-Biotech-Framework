# MCP servers exposed to agents as mcp__<name>__<tool>.
# Defaults launch the upstream FastMCP servers (Supplementary Text I). Any MCP
# server can be added: stdio (command/args) or streamable HTTP (url).
# The provenance server is replaced by native harness tools (src/vbt/tools/provenance.py).
servers:
  - name: expression
    # GTEx bulk RNA-seq expression
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/expression_mcp/server.py"]
    enabled: true
  - name: functional_genomics
    # DepMap CRISPR essentiality + Tahoe-100M drug perturbations
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/functional_genomics_mcp/server.py"]
    enabled: true
  - name: genetics
    # Open Targets Genetics (GWAS, L2G, credible sets, QTL coloc)
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/genetics_mcp/server.py"]
    enabled: true
  - name: target
    # Open Targets target annotations, tractability, safety
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/target_mcp/server.py"]
    enabled: true
  - name: drug
    # Open Targets / ChEMBL drug mechanisms, indications, warnings
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/drug_mcp/server.py"]
    enabled: true
  - name: single_cell
    # CELLxGENE Census
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/single_cell_mcp/server.py"]
    enabled: true
  - name: association
    # Open Targets target-disease associations + literature
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/association_mcp/server.py"]
    enabled: true
  - name: disease
    # Open Targets disease ontology
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/disease_mcp/server.py"]
    enabled: true
  - name: interaction
    # Protein-protein interaction networks
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/interaction_mcp/server.py"]
    enabled: true
  - name: pathway
    # Reactome pathways + Gene Ontology
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/pathway_mcp/server.py"]
    enabled: true
  - name: clinicaltrials
    # ClinicalTrials.gov + cBioPortal
    command: ${vars.mcp_python}
    args: ["${vars.upstream}/src/mcp_servers/clinicaltrials_mcp/server.py"]
    enabled: true
  - name: pubmed
    # PubMed search + abstracts via NCBI E-utilities (harness addition; see src/vbt/mcp_servers)
    command: ${vars.mcp_python}
    args: ["${vars.project_root}/src/vbt/mcp_servers/pubmed_server.py"]
    enabled: true
