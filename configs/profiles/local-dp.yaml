# Local Qwen3.8-27B (BF16) as data-parallel replicas on 2-8 GPUs (H200 / B200), one vLLM server
# with --data-parallel-size N. Same model and adapter as local-h100, more capacity.
#
#   vbt local serve --profile dp --data-parallel 4          # H100 nodes: --variant h100
#   vbt --profile local-dp local check
#
# Prefix caching is per replica and vLLM's DP balancer is not prefix-aware, so the adapter pins
# every agent session to one rank with the X-data-parallel-rank header (data_parallel_size below
# MUST equal the server's --data-parallel-size). Alternative: one server per GPU
# (CUDA_VISIBLE_DEVICES=i ... --port 800i) and
#   provider.options.base_urls: [http://localhost:8000/v1, http://localhost:8001/v1, ...]
#   provider.options.routing: urls
#
# With replicas, scientists can run at higher effort: xhigh with a 16K reasoning budget, kept
# fixed for the whole session. See local-h100.yaml for the tier mapping notes.

provider:
  name: vllm
  options:
    base_url: ${VBT_LLM_BASE_URL:-http://localhost:8000/v1}
    served_model_name: qwen3.8-27b
    family: qwen3_8
    read_timeout_s: 900
    max_concurrency: 256          # --max-num-seqs 64 per rank x 4 ranks
    data_parallel_size: 4         # = --data-parallel-size
    routing: header
    pricing: null

model_aliases:
  qwen: qwen3.8-27b

models:
  orchestrator: {model: qwen3.8-27b, effort: xhigh, thinking: true, max_tokens: 40960, thinking_budget: 24576,
                 context_window_tokens: 262144}
  scientist:    {model: qwen3.8-27b, effort: xhigh, thinking: true, max_tokens: 40960, thinking_budget: 16384,
                 context_window_tokens: 262144}
  support:      {model: qwen3.8-27b, effort: null, thinking: false, max_tokens: 16000,
                 context_window_tokens: 262144}
  bulk:         {model: qwen3.8-27b, effort: medium, thinking: true, max_tokens: 8192, thinking_budget: 3072,
                 context_window_tokens: 262144}

limits:
  max_parallel_agents: 16
  max_turn_tokens: 8000000        # token budgets; USD caps stay but local runs cost 0 USD
  max_item_tokens: 400000
  max_turn_cost_usd: 150
  max_item_cost_usd: null

bulk:
  default_concurrency: 128        # scales with the replica count

web:
  search:
    backend: auto
    searxng_url: ${SEARXNG_URL:-http://localhost:8888}

context:
  default_window_tokens: 262144
  soft_ratio: 0.6
  hard_ratio: 0.75
