# The Cell Ontology (CL) from an OBO file (docs/DATA_LAYER.md §6.8 S7, §11.5; phase 2, strict: true).
#
# Case studies 2 and 3 harmonise CELLxGENE cell types along the CL `is_a` hierarchy
# (src/vbt/analysis/ontology.py). The file is ${VBT_CL_OBO} (cl-basic.obo from the OBO Foundry;
# `vbt data acquire cell_ontology --env-file <file>` fetches the pinned release and writes the variable),
# else <project>/data/cell_ontology/cl-basic.obo. Without either the table is missing (never the 14-term
# test fixture, which the tests name through VBT_CL_OBO: DEP-3), and a file whose data-version is not the
# pinned release is stale (R2:release). Hierarchy expansion uses `is_a` only. Obsolete terms stay in the
# table and resolve through `replaced_by`.
#
# Checked on the real cl-basic.obo (http://purl.obolibrary.org/obo/cl/cl-basic.obo, data-version
# cl/releases/2026-06-08, read 2026-10-08; vbt ds check --depth deep): 3,540 terms (205 obsolete, 9 of them
# CP:NNNNNNN IDs moved into CL with `replaced_by`), `is_a` acyclic. Its `relationship` lines name the
# predicate by CURIE (RO:0002202 develops from: 396, BFO:0000050 part of: 3) and every target is a CL term:
# cl-basic has no UBERON edges (the full cl.obo has). One term (CL:4023064) asserts the same RELATED
# synonym twice with different PMIDs, so a synonym item has no key (the projection keeps text and scope).
# The 9 CP: IDs are terms of this file, so the id type accepts that prefix (`also_prefixes: [CP]`).
schema: vbt.datasource/1
source: cell_ontology
title: Cell Ontology (CL)
release: {from: format.data-version, match: "2026-06-08"}    # the pinned acquisition.release
defaults: {format: obo, layout: single_file, missing: unknown}
strict: true

id_types:
  cell_ontology: {plugin: cell_ontology, options: {also_prefixes: [CP]}, universe: term.id,
                  resolve_via: [term.name, term.synonyms],
                  rules: [exact, normalized, "label_exact:name", "label_casefold:name", "synonym:exact"],
                  retired: {flag: term.is_obsolete, replaced_by: term.replaced_by, consider: term.consider,
                            listed_in: [term.alt_id]},
                  hierarchy: {table: term, columns: [is_a], predicates: [is_a], reflexive: false}}
  uberon:        {plugin: uberon, resolvable: false}           # anatomy targets of part_of edges

tables:
  term:
    kind: ontology
    path: ${VBT_CL_OBO:-${vars.project_root}/data/cell_ontology/cl-basic.obo}
    grain: one Cell Ontology term (current or obsolete) of one release
    key: {columns: [id], check: full}
    coverage: {statement: "Every term of the loaded Cell Ontology release, obsolete terms included (existence only).",
               absence_means: absent, applies_to: entity}
    sentinels:
      present: [{key: {id: "CL:0000000"}, expect: {name: cell}}]
      absent:  [{key: {id: "CL:9999998"}}]
    columns:
      id:           {role: identifier, id_type: cell_ontology, self: true}
      name:         {role: label, of: id}
      namespace:    {role: category, vocab: data}
      def:          {role: text}
      synonyms:
        role: nested
        item_key: {identity: position}       # 'CGE interneuron' RELATED twice on CL:4023064 (VERIFIED)
        fields:
          text:  {role: synonym, of: /id, synonym_kind_from: scope}
          scope: {role: category, vocab: [exact, related, broad, narrow]}
      alt_id:       {role: identifier, id_type: cell_ontology, retired_into: id, path: "[]"}
      is_obsolete:  {role: flag, missing: "false", true_means: "the term is obsolete (kept for resolution only)"}
      replaced_by:  {role: identifier, id_type: cell_ontology, path: "[]", integrity: partial}
      consider:     {role: identifier, id_type: cell_ontology, path: "[]", integrity: partial}
      is_a:         {role: hierarchy, relation: parent, of: id, closure: direct, predicate: is_a,
                     target_id_type: cell_ontology}
      relationship:
        role: nested
        item_key: [type, target]
        fields:
          type:   {role: category, vocab: data,
                   values: {"RO:0002202": "develops from", "BFO:0000050": "part of"}}   # cl-basic's CURIE predicates
          target: {role: hierarchy, relation: parent, of: /id, closure: direct,
                   predicate: [part_of, develops_from, "BFO:0000050", "RO:0002202"],
                   integrity: partial}                       # cl.obo's UBERON targets are outside the CL universe
      xref:         {role: identifier, xref: true, id_type_from: prefix, cardinality: many, path: "[]", resolvable: false}
      subset:       {role: category, vocab: data, path: "[]"}

# ---------------------------------------------------------------------------------------------- acquisition
# `vbt data acquire cell_ontology`: cl-basic.obo of the pinned CL release (OBO Foundry versioned PURL, a GitHub
# release asset; 3,347,518 bytes, data-version cl/releases/2026-06-08, sha256 recorded on 2026-10-08) and, when named
# (`cell_ontology.uberon_basic`), uberon-basic.obo of UBERON release 2026-10-01 (12,155,980 bytes on 2026-10-08).
# VBT_CL_OBO points the term table at the file.
acquisition:
  release: "2026-06-08"
  homepage: https://obofoundry.org/ontology/cl.html
  licence: "CC BY 4.0 (the file's terms:license header; some term depictions are CC BY-NC-ND 4.0 images, not in the
    file)"
  transport:
    plugin: http
    options:
      files:
        cl-basic.obo: {url: "https://purl.obolibrary.org/obo/cl/releases/{release}/cl-basic.obo", bytes: 3347518,
                       sha256: 73996c6349283e7a8cbd8183367a1cb810d0077e9c291ae0c72bd31e869f8c1c}
        uberon-basic.obo: {url: "https://purl.obolibrary.org/obo/uberon/releases/2026-10-01/uberon-basic.obo",
                           bytes: 12155980}
  dir: cell_ontology/{release}
  env: {VBT_CL_OBO: "{home}/cl-basic.obo"}
  tables:
    term: {files: [cl-basic.obo], count: 1, bytes: 3347518}
  extra:
    uberon_basic: {files: [uberon-basic.obo], count: 1, bytes: 12155980, optional: true,
                   note: "UBERON anatomy terms; no table reads them yet (the uberon id type checks syntax only)"}
