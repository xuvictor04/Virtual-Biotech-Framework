# The paper's Zenodo case-study archive (doi:10.5281/zenodo.22259123), extracted by
# `vbt data zenodo fetch` (docs/DATA_LAYER.md §6.3, §6.7 S5, §6.8 S1/S10; phase 2, strict: true).
#
# The Open Targets 25.09 extracts declare `implements` and `lineage`, so overlays bound to
# open_targets tables can be served from them when the operator sets data.sources.alias:
# {open_targets: zenodo_vbt}; their columns mirror the open_targets descriptor. Columns the
# phase-1 bindings never read are `optional: true` (which columns the authors kept is
# SCHEMA-DEPENDENT on the extract): readiness warns when one is missing, and strict readiness
# reports any further physical column as schema_drift. The four GEO cohort files of the OSMR case
# study are one matrix table with a fragment key and per-fragment overrides (§6.7).
#
# Checked on the local extract of the archive (vbt ds check --depth deep on all six tables, plus full-table
# reads, 2026-10-08): the verified:false facts are resolved below; (VERIFIED) marks counts from those reads.
schema: vbt.datasource/1
source: zenodo_vbt
title: The Virtual Biotech case-study archive (Zenodo 22259123)
kind: local
release: {expect: "22259123", from: literal}
root: ${VBT_ZENODO_DIR:-${vars.project_root}/data/zenodo}/virtualbiotech_submission
defaults: {format: parquet, layout: sharded_dir, missing: unknown}
strict: true

id_types:
  nct_id:        {plugin: nct_id, universe: clinical_trial_labels.nct_id, resolvable: false}
  geo_gsm:       {plugin: geo_gsm, universe: {table: ibd_cohorts, keys: ["@row.sample_id"], per_fragment: true}}
  # gene symbols as the authors' pre-2020 HGNC snapshot stores them (SEPT9, not SEPTIN9): a release
  # snapshot, never resolved as current labels; universes are per cohort file (platform-dependent)
  cohort_symbol: {plugin: hgnc_symbol, authority: release_snapshot,
                  universe: {table: ibd_cohorts, keys: ["@col.gene_symbol"], per_fragment: true}}

tables:
  # -------------------------------------------------------------------- OT 25.09 extracts
  disease:
    kind: ontology
    path: clinical_trials/data/disease
    implements: "open_targets:disease@25.09"
    lineage: {source: open_targets, release: "25.09", table: disease}
    grain: one ontology term used by Open Targets as a disease, phenotype, measurement or process
    key: {columns: [id], check: full}
    constraints:
      - {column: ontology.leaf, op: equals_expr, expr: "len(children) == 0", verified: false, on_refute: drop_field,
         origin: "false for all 39,530 terms while 31,635 have no children (Zenodo 22259123)"}
        # REFUTED on the archive (VERIFIED): leaf is false for every term, so readiness drops the field
    columns:
      id:               {role: identifier, id_type: "open_targets:ot_disease", self: true}
      name:             {role: label, of: id, unique: false}
      therapeuticAreas: {role: identifier, id_type: "open_targets:ot_disease", path: "[]", cardinality: many}
      obsoleteTerms:    {role: identifier, id_type: "open_targets:ot_disease", retired_into: id, path: "[]"}
      parents:          {role: hierarchy, relation: parent, of: id, closure: direct, inverse_of: children}
      children:         {role: hierarchy, relation: child, of: id, closure: direct, inverse_of: parents}
      ontology:         {role: nested, fields: {isTherapeuticArea: {role: flag, missing: unknown},
                                                leaf: {role: flag, missing: unknown, verified: false},   # refuted: see constraints
                                                name: {role: payload, optional: true},
                                                sources: {role: payload, optional: true}}}
      code:             {role: reference, ref_kinds: [url], optional: true}
      description:      {role: text, optional: true}
      dbXRefs:          {role: identifier, xref: true, id_type_from: prefix, cardinality: many, path: "[]", optional: true}
      obsoleteXRefs:    {role: payload, optional: true}
      synonyms:         {role: nested, optional: true,
                         fields: {hasExactSynonym: {role: synonym, of: /id, synonym_kind: exact, path: "[]"},
                                  hasRelatedSynonym: {role: synonym, of: /id, synonym_kind: related, path: "[]"},
                                  hasNarrowSynonym: {role: synonym, of: /id, synonym_kind: narrow, path: "[]"},
                                  hasBroadSynonym: {role: synonym, of: /id, synonym_kind: broad, path: "[]"}}}
      # VERIFIED on all 39,530 terms: each list is the transitive closure of parents (children), never the term itself
      ancestors:        {role: hierarchy, relation: ancestor, of: id, closure: transitive, closure_of: parents,
                         reflexive: false, optional: true}
      descendants:      {role: hierarchy, relation: descendant, of: id, closure: transitive, closure_of: children,
                         reflexive: false, optional: true}
      directLocationIds:   {role: payload, optional: true}
      indirectLocationIds: {role: payload, optional: true}

  drug_molecule:
    kind: entity
    path: clinical_trials/data/drug_molecule
    implements: "open_targets:drug_molecule@25.09"
    lineage: {source: open_targets, release: "25.09", table: drug_molecule}
    grain: one ChEMBL molecule (a parent compound or one of its salt forms)
    key: {columns: [id], check: full}
    alternate_keys: [{columns: [inchiKey], nullable: [inchiKey], check: full}]
    grains: {molecule: [id], parent_molecule: {columns: [id], canonicalize: "open_targets:chembl_molecule.parent"}}
    columns:
      id:             {role: identifier, id_type: "open_targets:chembl_molecule", self: true}
      name:           {role: label, of: id, unique: false, placeholder_when: equals_key}
      drugType:       {role: category, vocab: data, placeholders: [Unknown]}
      parentId:       {role: identifier, id_type: "open_targets:chembl_molecule", ref: drug_molecule.id, integrity: partial}
      childChemblIds: {role: identifier, id_type: "open_targets:chembl_molecule", ref: drug_molecule.id,
                       integrity: partial, path: "[]"}   # 2,704 of 4,301 dangle in the extract
      inchiKey:       {role: identifier, id_type: "open_targets:inchikey", alternate_key: true, optional: true}
      canonicalSmiles: {role: payload, optional: true}
      synonyms:       {role: synonym, of: id, synonym_kind: alias, path: "[]", optional: true}
      tradeNames:     {role: synonym, of: id, synonym_kind: alias, path: "[]", optional: true}
      description:    {role: text, optional: true}
      blackBoxWarning: {role: flag, missing: unknown, optional: true}
      hasBeenWithdrawn: {role: flag, missing: unknown, optional: true}
      isApproved:     {role: flag, missing: unknown, optional: true}
      yearOfFirstApproval: {role: time, precision: year, missing: unknown, optional: true}
      maximumClinicalTrialPhase: {role: measure, statistic: clinical_phase, scale: [0, 4], missing_values: [-1],
                                  encoding: {0.5: early_phase_1, 4: approved}, missing: unknown, optional: true}
                                  # VERIFIED on 18,119 molecules: -1 (304), 0.5 (17), 1-4, null (6,842); 4 iff isApproved
      crossReferences: {role: nested, item_key: [source], optional: true, fields: {
                          source: {role: category, vocab: data},
                          ids: {role: identifier, xref: true, path: "[]", cardinality: many, resolvable: false}}}
      linkedTargets:  {role: nested, optional: true, fields: {
                          rows: {role: member, membership: {set: {parent: id},
                                                            member: {path: "[]", id_type: "open_targets:ensembl_gene"}}},
                          count: {role: count, counts: "linked targets", length_of: rows}}}
      linkedDiseases: {role: nested, optional: true, fields: {
                          rows: {role: member, membership: {set: {parent: id},
                                                            member: {path: "[]", id_type: "open_targets:ot_disease"}}},
                          count: {role: count, counts: "linked diseases", length_of: rows}}}

  association_by_datatype_direct:
    kind: fact
    path: clinical_trials/data/association_by_datatype_direct
    implements: "open_targets:association_by_datatype_direct@25.09"
    lineage: {source: open_targets, release: "25.09", table: association_by_datatype_direct}
    grain: one direct target-disease association score within one data type
    key: {columns: [diseaseId, targetId, datatypeId], check: full}
    rank: [{column: score, direction: desc, nulls: last, within: [datatypeId]}]
    coverage: {statement: "The OT 25.09 direct per-datatype associations the authors extracted for case study 1.",
               absence_means: unknown}
    columns:
      diseaseId:  {role: identifier, id_type: "open_targets:ot_disease", ref: disease.id, integrity: partial}
      targetId:   {role: identifier, id_type: "open_targets:ensembl_gene"}
      datatypeId: {role: category, vocab: data, scope: {kind: stratum, pooling: forbid, pool_ok_for: [exists, count, distinct]}}
      score:      {role: measure, statistic: score_0_1, scale: [0, 1], comparable_within: [datatypeId], missing: unknown}
      evidenceCount: {role: count, counts: "evidence strings of this data type", comparable_within: [datatypeId],
                      optional: true}

  chembl_clinical_nct:
    kind: crosswalk
    path: clinical_trials/data/chembl_clinical_nct_data.parquet
    layout: single_file
    grain: one (ClinicalTrials.gov study, drug, target, disease) link from ChEMBL clinical candidates
    # one row per (nct, drug, target, disease): (nct_id, targetId) repeats 125,263 times in the archive
    key: {columns: [nct_id, drugId, targetId, diseaseId], check: full}
    columns:
      nct_id:    {role: identifier, id_type: nct_id}
      # 481 salt-form IDs among 3,936 (§11.5): a parent query is answered per family
      drugId:    {role: identifier, id_type: "open_targets:chembl_molecule", form: any, integrity: partial}
      targetId:  {role: identifier, id_type: "open_targets:ensembl_gene", integrity: partial}
      diseaseId: {role: identifier, id_type: "open_targets:ot_disease", integrity: partial}
      phase:     {role: measure, statistic: numeric, missing: unknown}
      status:    {role: category, vocab: data}
      trial_date: {role: payload}
      mechanism_of_action: {role: payload}          # all null in the archive
      disease_name: {role: label, of: diseaseId}
      targetFromSourceId: {role: payload}
      studyId:   {role: payload}                    # the ChEMBL clinical study (equals nct_id in the archive)
      drugFromSource: {role: payload}               # all null in the archive
      studyStopReason: {role: text}
      studyStopReasonCategories: {role: payload}
      dtd_combo: {role: payload}                    # drugId___targetId___diseaseId

  # -------------------------------------------------------------------- case study 1 labels
  clinical_trial_labels:
    kind: records
    path: clinical_trials/data/clinical_trial_labels_reconciled.csv
    layout: single_file
    format: csv
    grain: one reconciled outcome label of one ClinicalTrials.gov study (case study 1 ground truth)
    key: {columns: [nct_id], check: full}
    expose: {native: false, withhold_from: [trial-annotator, clinical-trialist],
             reason: "evaluation labels of case study 1; agents that annotate trials must not see them"}
    column_patterns:
      "ae_serious_{organ}_pct": {role: measure, statistic: percent, scale: [0, 100], missing: unknown}
    columns:
      nct_id:                    {role: identifier, id_type: nct_id, self: true}
      primary_endpoint_result:   {role: category, vocab: [POSITIVE, NEGATIVE, UNKNOWN]}
      secondary_endpoint_result: {role: category, vocab: [POSITIVE, NEGATIVE, UNKNOWN]}
      virtualbiotech_stop_reason_categories: {role: category, vocab: data, list_delimiter: "|"}
      results_source:            {role: category, vocab: data}
      ae_source:                 {role: category, vocab: data}
      pubmed_ids:                {role: reference, ref_kinds: [pmid], list_delimiter: "|"}
      confidence:                {role: category, vocab: [high, medium, low], optional: true}   # absent from the archive
      phase:                     {role: measure, statistic: numeric, missing: unknown}
      status:                    {role: category, vocab: data}
      studyStopReason:           {role: text}
      studyStopReasonCategories: {role: category, vocab: data, list_delimiter: "|"}
      phase2_progression:        {role: category, vocab: [NEVER, EVER]}
      has_results:               {role: category, vocab: data}
      ae_has_safety_signals:     {role: category, vocab: data}
      ae_has_serious_pct_data:   {role: category, vocab: data}

  # -------------------------------------------------------------------- S5: GEO cohort matrices (OSMR)
  ibd_cohorts:
    kind: matrix
    path: osmr/code/data/GSE*.h5ad                 # one fragment per file (single_file accepts a glob)
    layout: single_file
    format: {plugin: h5ad, options: {backed: r}}
    fragment_key: {name: cohort, from: filename_regex, pattern: "(GSE\\d+)\\.h5ad$"}
    # The response column differs per cohort (src/vbt/analysis/biomarker.py AUTHORS_IFX_COHORTS):
    # existence of a column is evaluated per fragment, and a missing one is `not_measured_in`.
    fragment_overrides:
      GSE73661: {response_clinical: {absent: true}, response_mucosal_healing: {role: category, vocab: [R, NR]}}
      GSE23597: {response_clinical_w30: {role: category, vocab: [R, NR]}}
    grain: one (sample, gene) log2 microarray intensity in one GEO cohort file
    key: {columns: [cohort, "@row.sample_id", "@col.gene_symbol"], check: full}
    coverage: {statement: "A gene absent from a cohort was not on that platform; symbols are pre-2020 HGNC.",
               absence_means: unknown, universe: {table: ibd_cohorts, keys: ["@col.gene_symbol"], per_fragment: true}}
    matrix:
      axes:
        obs: {name: sample, from: index, index_name: sample_id, key: {columns: [sample_id]},
              columns: {sample_id: {role: identifier, id_type: geo_gsm, self: true},
                        patient_id: {role: category, vocab: data, unique_within: [cohort], scope: {kind: replicate, pooling: list}},
                        timepoint: {role: category, vocab: data, placeholders: ["nan"]},
                        disease: {role: category, vocab: data, optional: true},
                        drug: {role: category, vocab: data, optional: true},
                        is_baseline: {role: flag, missing: unknown, optional: true},
                        response_clinical: {role: category, vocab: [R, NR], optional: true,
                                            description: "clinical response (R) or not (NR) as the authors coded it"},
                        response_mucosal_healing: {role: category, vocab: [R, NR], optional: true, present_in: [GSE73661]},
                        response_clinical_w30: {role: category, vocab: [R, NR], optional: true, present_in: [GSE23597]},
                        response_remission: {role: category, vocab: [R, NR], optional: true},   # all NaN in the four files
                        mayo_score: {role: measure, statistic: numeric, missing: unknown, optional: true,
                                     present_in: [GSE73661]},   # 0-3 in GSE73661, all NaN elsewhere
                        cohort: {role: category, vocab: data, optional: true},     # the GSE accession (the fragment key)
                        platform: {role: category, vocab: data, optional: true},   # GPL570 x3, GPL6244 (GSE73661)
                        age: {role: measure, statistic: numeric, unit: years, missing: unknown, optional: true},   # all NaN
                        sex: {role: category, vocab: data, optional: true}}}      # all NaN in the four files
        var: {name: gene, from: index, index_name: gene_symbol, key: {columns: [gene_symbol]},
              columns: {gene_symbol: {role: identifier, id_type: cohort_symbol, self: true, authority: release_snapshot}}}
      values:
        X: {role: measure, statistic: log2_intensity, fallback: numeric, missing: unknown,
            comparable_within: [cohort]}
            # VERIFIED: float32, no NaN or negative value; per file min-max (median) 0.26-16.79 (7.60) GSE12251,
            # 0.00-15.64 (5.49) GSE16879, 0.14-16.79 (7.57) GSE23597, 2.37-14.28 (6.99) GSE73661
      sections: {uns.cohort_info: {role: payload},
                 obsm.X_pca: {role: vector, dim: 50, optional: true}}   # no obsm in any of the four files

# ---------------------------------------------------------------------------------------------- acquisition
# `vbt data acquire zenodo_vbt`: the members these tables read, extracted from the record's 2.9 GB zip with range
# requests (only the central directory and those members are transferred; each member is checked by its CRC-32).
# Read on 2026-10-08: record 22259123 redirects to its current version 22259124 (doi:10.5281/zenodo.22259124,
# published 2026-09-02), file virtualbiotech_submission.zip, 2,909,966,318 bytes, md5 9e30309e22cf269431af573fd732fb49,
# 2,866 members; the six tables below are 30 members, 92,001,168 bytes. `vbt data zenodo fetch --preset ...`
# extracts other parts of the archive (case-study code, results, traces).
acquisition:
  release: "22259123"
  homepage: https://doi.org/10.5281/zenodo.22259123
  licence: "CC BY 4.0 (the Zenodo record's license)"
  transport:
    plugin: zip_member
    options:
      archive_index: {index: "https://zenodo.org/api/records/{release}", files: "$.files[*]", path: "$.key",
                      url: "$.links.self", size: "$.size", checksums: {md5: "$.checksum"},
                      select: virtualbiotech_submission.zip,
                      record: {version_record: "$.id", doi: "$.doi", published: "$.metadata.publication_date"}}
  dir: zenodo/{release}
  env: {VBT_ZENODO_DIR: "{home}"}
  tables:
    disease:                        {files: ["virtualbiotech_submission/clinical_trials/data/disease/**"],
                                     count: 1, bytes: 5545555}
    drug_molecule:                  {files: ["virtualbiotech_submission/clinical_trials/data/drug_molecule/**"],
                                     count: 2, bytes: 2275731}
    association_by_datatype_direct: {files: ["virtualbiotech_submission/clinical_trials/data/association_by_datatype_direct/**"],
                                     count: 21, bytes: 32355246}
    chembl_clinical_nct:            {files: [virtualbiotech_submission/clinical_trials/data/chembl_clinical_nct_data.parquet],
                                     count: 1, bytes: 10376365}
    clinical_trial_labels:          {files: [virtualbiotech_submission/clinical_trials/data/clinical_trial_labels_reconciled.csv],
                                     count: 1, bytes: 6741476}
    ibd_cohorts:                    {files: ["virtualbiotech_submission/osmr/code/data/GSE*.h5ad"], count: 4,
                                     bytes: 34706795}
