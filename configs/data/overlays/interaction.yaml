# Overlay for the upstream interaction server (interaction_mcp; docs/DATA_LAYER.md §6.8 S8, Appendix A).
# Phase 1: 1 pass, 2 derived, 2 block. Phase 3 (F17): the network tools are derived from the
# deterministic traversal of the edges table (frontier in key order, edges by full key, sources never
# pooled): 1 pass, 4 derived, 0 block.
schema: vbt.overlay/1
server: interaction
sources: [open_targets]
upstream_commit: ${vars.upstream_commit:-71f9da68c95c5ee0ef4c1d9b8f45f10693de022d}   # the commit these bindings were reviewed against
tools:
  get_interactions:
    reads: {open_targets.interaction: {access: full_table}}
    args:
      target_id:       {binds_any: [open_targets.interaction.targetA, open_targets.interaction.targetB],
                        accepts: [ensembl_gene, hgnc_symbol]}           # either side of an undirected edge
      species:         {binds_any: [open_targets.interaction.speciesA.scientificName, open_targets.interaction.speciesB.scientificName],
                        match: casefold}                                 # species on either side
      source_database: {binds: open_targets.interaction.sourceDatabase, match: casefold}
      limit:           {role: limit, min: 1, max: 1000, limit_mode: per_group}   # scores rank only within one source
    result:
      rows: $.interactions
      count_fields: [$.count]
      arg_echo: {limit: $.limit}
      order: [{column: scoring, direction: desc, nulls: last, within: [sourceDatabase]},
              {column: targetA, direction: asc}, {column: targetB, direction: asc}]
    serve: pass
    defects:
      - {id: OT-INT-001, what: "head(limit) in file order: the top interactions are not the highest-scoring, and STRING and IntAct scores are mixed",
         where: "interaction_mcp/tools.py:116", effect: silent_wrong}
      - {id: OT-INT-004, what: "species matched as a substring of the str() of the species struct; source_database as a regex substring",
         where: "interaction_mcp/tools.py:100-114", effect: silent_wrong}

  search_interactions:
    reads: {open_targets.interaction: {access: full_table}}
    args:
      # an undirected edge: each endpoint matches either side, so one endpoint alone finds every edge of
      # that gene and both together find the pair stored as (A, B) or (B, A)
      target_a:        {binds_any: [open_targets.interaction.targetA, open_targets.interaction.targetB],
                        accepts: [ensembl_gene, hgnc_symbol]}
      target_b:        {binds_any: [open_targets.interaction.targetA, open_targets.interaction.targetB],
                        accepts: [ensembl_gene, hgnc_symbol]}
      source_database: {binds: open_targets.interaction.sourceDatabase, match: casefold}
      min_count:       {binds: open_targets.interaction.count, op: ge, min: 0}
      limit:           {role: limit, min: 1, max: 1000, limit_mode: per_group}
    require_any: [[target_a, target_b]]
    result:
      rows: $.interactions
      count_fields: [$.count]
      arg_echo: {limit: $.limit}
      order: [{column: scoring, direction: desc, nulls: last, within: [sourceDatabase]},
              {column: targetA, direction: asc}, {column: targetB, direction: asc}]
    serve: derived
    derived: {verb: find, table: open_targets.interaction}
    defects:
      - {id: OT-INT-002, what: "target_a only matches targetA and target_b only targetB: an undirected pair stored as (B, A) is missed",
         where: "interaction_mcp/tools.py:174-178", effect: false_empty}

  get_interaction_evidence:
    reads: {open_targets.interaction_evidence: {access: bounded_scan}}
    args:
      target_id: {binds_any: [open_targets.interaction_evidence.targetA, open_targets.interaction_evidence.targetB],
                  accepts: [ensembl_gene, hgnc_symbol]}
      limit:     {role: limit, min: 1, max: 1000}
    result:
      rows: $.evidence
      count_fields: [$.count]
    serve: derived
    derived: {verb: find, table: open_targets.interaction_evidence}
    defects:
      - {id: OT-INT-003, what: "searches targetA only: evidence where the gene is the second interactor is never returned",
         where: "interaction_mcp/tools.py:247-253", effect: false_empty}

  get_interaction_network:
    reads: {open_targets.interaction: {access: bounded_scan}}
    args:
      seed_targets:     {binds_any: [open_targets.interaction.targetA, open_targets.interaction.targetB], op: in, each: true,
                         accepts: [ensembl_gene, hgnc_symbol]}
      max_hops:         {role: family_param, min: 1, max: 4}
      min_confidence:   {role: unbound}           # one threshold across incomparable sources: refused unless 0
      max_network_size: {role: family_param, min: 1}
    witness: false                                 # a traversal, not rows matching the arguments
    result:
      kind: record
      rows: [$.nodes, $.edges]
      row_key: [sourceDatabase, intA, intB, targetA, targetB]
      count_fields: {"$.network_size": "len($.nodes)", "$.edge_count": "len($.edges)"}
    serve: derived
    derived:
      verb: find
      table: open_targets.interaction
      split: {network: {mode: network}}
      envelope: {seed_targets: "{seed_targets}", max_hops: "{max_hops}", network_size: null, edge_count: null}
      sections:
        statistics: {path: $.statistics, table: open_targets.interaction, verb: count}
    text:
      notes:
        - "The frontier is expanded in key order and edges are keyed by source database and interactor pair, so the same call gives the same network; network_truncated and statistics.network.frontier say where max_network_size cut it."
        - "Scores of different sources are not comparable; min_confidence other than 0 is refused."
    defects:
      - {id: OT-INT-005, what: "breadth-first expansion iterates a Python set: edges kept under max_network_size depend on the hash seed (2, 2, 4, 4, 3, 4 edges over six runs)",
         where: "interaction_mcp/tools.py:343-401", effect: silent_wrong}
      - {id: OT-INT-006, what: "min_confidence thresholds STRING, IntAct, Reactome and SIGNOR scores together",
         where: "interaction_mcp/tools.py:339-340", effect: silent_wrong}

  find_common_interactors:
    reads: {open_targets.interaction: {access: bounded_scan}}
    args:
      target_ids:     {binds_any: [open_targets.interaction.targetA, open_targets.interaction.targetB], op: in, each: true,
                       accepts: [ensembl_gene, hgnc_symbol]}
      min_targets:    {role: family_param, min: 1}
      min_confidence: {role: unbound}
      limit:          {role: limit, min: 1, max: 1000}
    witness: false
    result:
      rows: $.common_interactors
      row_key: [interactor_id]
      count_fields: [$.count]
    serve: derived
    derived:
      verb: find
      table: open_targets.interaction
      split: {network: {mode: common}}
      envelope: {input_targets: "{target_ids}", count: null}
    text:
      drop_promises: [avg_confidence]
      notes: ["Partners are listed per source database with that source's best score; scores are never averaged across sources."]
    defects:
      - {id: OT-INT-007, what: "avg_confidence averages scores of different source databases",
         where: "interaction_mcp/tools.py:536-537", effect: silent_wrong}
