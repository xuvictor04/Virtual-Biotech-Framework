# Overlay for the harness's own data child (src/vbt/datalayer/service/server.py; docs/DATA_LAYER.md §10.6).
# Phase 2 (F14): the public verbs of service/verbs/public.py are listed as mcp__data__<verb>. Phase 3
# (F17, F18): multi-hop neighbors, propagated members, and the public expand and enrich verbs.
#
# The data child answers from the descriptors itself (identifiers resolved by the same resolver the
# gateway uses, honest totals, coverage, typed errors), so every binding is `serve: pass` without a
# witness: the child is the source of truth, not an upstream tool to check. What the gateway adds is the
# listing (the table enums minus `expose.native: false` tables, and the per-column `where` schemas;
# derive/tools.py) and the calling agent: every call carries `agent`, so the child refuses the tables
# whose `expose.withhold_from` names it.
# Hidden verbs (`_serve`, `_witness`, ...) are never listed and need no binding.
schema: vbt.overlay/1
server: data
sources: []
tools:
  resolve:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Resolve identifiers to one canonical key of an id_type by a recorded rule."}
  describe:
    result: {kind: record, rows: $}
    serve: pass
    witness: false
    text: {summary: "Describe a data source or table: grain, key, column roles, rank, coverage and verbs."}
  lookup:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "The record of one complete key of a table."}
  find:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Rows of a table matching resolved filters, ranked with honest totals."}
  search:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Rows whose key, label or synonym matches a text, ordered by match class."}
  vocab:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "The distinct values of a category or scope column."}
  members:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "The members of one set; propagate=true adds the members of every descendant set once each."}
  aggregate:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Grouped aggregation with per-group n, unknowns excluded and counted, and a minimum n."}
  similar:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Cosine top-k around an anchor (excluded from the results and the total)."}
  neighbors:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Edges around one or more nodes over 1-4 hops, in key order, sources never pooled."}
  expand:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Descendants or ancestors of terms under an id_type's hierarchy (declared predicates only), with depth."}
  enrich:
    result: {rows: $.rows, total: $._vbt.total}
    serve: pass
    witness: false
    text: {summary: "Over-representation of a gene list in the sets of a member column (hypergeometric p, BH q)."}
