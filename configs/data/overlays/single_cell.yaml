# Overlay for the upstream single_cell server (single_cell_mcp, CELLxGENE Census; docs/DATA_LAYER.md §6.7,
# Appendix A). Phase 1: 11 pass. value_filter (escape: soma) is a SOMA expression the gateway parses into the
# Predicate IR (gateway/soma_filter.py), so is_primary_data and dataset scope are checked before the call.
#
# Phase 4: obs and var are soma tables. get_anndata, get_expression_for_genes and get_anndata_donor_balanced
# are admitted count-first (`count_first`: the gateway asks the data child's _census_count for the cells the
# value_filter selects, against the release 'stable' resolves to, and refuses too_large when cells x genes
# exceeds the server's limit, before upstream fetches anything). get_expression_for_genes' genes_found and
# genes_not_found are recomputed from the written h5ad's var.feature_name (census_count.genes_from_h5ad):
# upstream compares against positional var_names. Donor balancing stays upstream's, accepted only when the
# filter fixes one dataset_id (requires_fixed): donors are unique only within (dataset_id, donor_id). The
# derived donor-balanced sample (_census_count `sample`: the (dataset_id, donor_id)-balanced soma_joinids and the
# value_filter/max_cells that make upstream fetch exactly them) is computed by the data child; routing this
# tool through it needs the gateway (docs/DATA_LAYER_STATUS.md, F20).
#
# Checked against the real Census (2025-11-08) through the unmodified server on 2026-10-08: an h5ad written
# by cellxgene_census.get_anndata keeps soma_joinid as an obs column, feature_id as a var column and a
# positional var index ('0', '1', ...) by construction, so the file checks ask for obs.soma_joinid (key_columns)
# and var.feature_id (var_key_columns, the descriptor's matrix key) and no longer refuse the positional var index
# (genes are matched on var.feature_name/feature_id, never var_names).
# obs_columns is passed as given: as a `projection` the gateway added the key of the bound table, which is
# var when genes are named, so upstream was asked for an obs column feature_id (a real source_error); name
# soma_joinid in obs_columns to keep the cell key (get_anndata without obs_columns returns every obs column).
schema: vbt.overlay/1
server: single_cell
sources: [cellxgene_census]
upstream_commit: ${vars.upstream_commit:-71f9da68c95c5ee0ef4c1d9b8f45f10693de022d}   # the commit these bindings were reviewed against
tools:
  get_census_info:
    reads: {cellxgene_census.obs: {access: upstream}, cellxgene_census.var: {access: upstream}}
    args: {}
    result:
      kind: record
      rows: $
      as_of: $.census_version                  # 'stable' resolves to a dated release; recorded, never assumed
    serve: pass

  list_metadata_values:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 64}}
    args:
      # one column name, not a projection: as `projection` the gateway appended the key columns and upstream
      # read a column named "cell_type, soma_joinid, is_primary_data" (a real source_error, 2026-10-08)
      column_name:  {role: family_param}
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns (==, !=, in, and, or); parsed by the gateway"}
      limit:        {role: limit, min: 1, max: 100000}
    result:
      rows: $.value_counts
      row_key: [value]
      exists_when: "$.count != 0"              # unused categorical levels come back with count 0 (path tests know ==, !=, =~ only)
      drop_fields: {$.total_unique_values: "len() of the value counts after head(limit): capped at limit and includes unused categories"}
    serve: pass

  search_genes:
    reads: {cellxgene_census.var: {access: upstream}}
    args:
      gene_symbols: {binds: cellxgene_census.var.feature_name, op: in, each: true, accepts: ["open_targets:hgnc_symbol"],
                     existence: upstream, send_as: label, on_missing: partial}
      ensembl_ids:  {binds: cellxgene_census.var.feature_id, op: in, each: true, accepts: [census_feature],
                     existence: upstream, on_missing: partial}
    require_any: [[gene_symbols, ensembl_ids]]
    result:
      rows: $.genes_found
      row_key: [feature_id]
      count_fields: {"$.total_found": "len($.genes_found)", "$.total_not_found": "len($.genes_not_found)"}
    serve: pass

  query_cell_metadata:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 200}}
    args:
      output_path:  {role: output_path}
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns (==, !=, in, and, or); parsed by the gateway"}
      columns:      {role: projection}            # soma_joinid and dataset_id are added so rows keep their key
      limit:        {role: limit, min: 1, max: 1000000}
    result:
      kind: file
      rows: null
      total: {path: $.n_cells_total, method: upstream}
      summary_fields: {$.column_stats: drop}      # statistics over the truncated rows
      files: [{path_from: $.output_path, must_exist: true, key_columns: [soma_joinid, dataset_id], write_once: true}]
    serve: pass
    defects:
      - {id: SC-002, what: "df.iloc[:limit] keeps the first cells by join id (the first datasets), not a sample of the filter",
         where: "single_cell_mcp/tools.py:348-352", test: test_dl_defect_detectors.py::test_sc_002, effect: silent_wrong}

  get_anndata:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 200}, cellxgene_census.var: {access: upstream}}
    args:
      output_path:  {role: output_path}
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns; is_primary_data == True is enforced unless include_duplicates"}
      gene_symbols: {binds: cellxgene_census.var.feature_name, op: in, each: true, accepts: ["open_targets:hgnc_symbol"],
                     existence: upstream, send_as: label}
      ensembl_ids:  {binds: cellxgene_census.var.feature_id, op: in, each: true, accepts: [census_feature], existence: upstream}
      obs_columns:  {role: family_param}           # passed as given (see the header: not a projection here)
      layer:        {role: selector, values: {raw: cellxgene_census.anndata_outputs, normalized: cellxgene_census.anndata_outputs}}
    count_first: {table: cellxgene_census.obs, filter_arg: value_filter, genes_arg: gene_symbols}
    result:
      kind: file
      rows: null
      files:
        - {path_from: $.output_path, must_exist: true, echo_checks: {n_obs: $.n_cells, n_vars: $.n_genes},
           key_columns: [soma_joinid], var_key_columns: [feature_id], write_once: true}
    serve: pass

  count_cells:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 8}}
    args:
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns; is_primary_data == True is enforced unless include_duplicates"}
    result:
      kind: count
      rows: null
      total: {path: $.n_cells, method: upstream}
      drop_fields: {$.recommendation: "sizing advice from a fixed GB estimate, not data; misleading when no cell matches"}
    serve: pass

  get_gene_statistics:
    reads: {cellxgene_census.var: {access: upstream}}
    args:
      gene_symbols: {binds: cellxgene_census.var.feature_name, op: in, each: true, accepts: ["open_targets:hgnc_symbol"],
                     existence: upstream, send_as: label, on_missing: partial}
      ensembl_ids:  {binds: cellxgene_census.var.feature_id, op: in, each: true, accepts: [census_feature],
                     existence: upstream, on_missing: partial}
    require_any: [[gene_symbols, ensembl_ids]]
    result:
      rows: $.gene_statistics
      row_key: [feature_id]
      fields:
        sparsity: {computed: {expr: "1 - nnz / n_measured_obs", undefined_when: [{eq: [n_measured_obs, 0]}]}}
        percent_nonzero: {computed: {expr: "100 * nnz / n_measured_obs", undefined_when: [{eq: [n_measured_obs, 0]}]}}
      count_fields: {"$.total_found": "len($.gene_statistics)"}
    serve: pass
    defects:
      - {id: SC-003, what: "a gene measured in no cell gets sparsity 1.0 (all zeros) instead of undefined",
         where: "single_cell_mcp/tools.py:635", test: test_dl_defect_detectors.py::test_sc_003, effect: silent_wrong}

  summarize_datasets:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 120}}
    args:
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns; parsed by the gateway"}
      limit:        {role: limit, min: 1, max: 10000}
    result:
      rows: $.datasets
      row_key: [dataset_id]
      total: {path: $.total_datasets, method: upstream}
    serve: pass

  get_cell_type_tissue_matrix:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 64}}
    args:
      output_path:      {role: output_path}
      value_filter:     {role: free_text, interpreted_as: engine,
                         engine_doc: "SOMA value_filter over obs columns; parsed by the gateway"}
      top_n_cell_types: {role: family_param, min: 1}
      top_n_tissues:    {role: family_param, min: 1}
    result:
      kind: file
      rows: $.top_combinations
      row_key: [cell_type, tissue]
      drop_fields:
        $.n_cell_types: "counts the top-N capped cross-tab, not every cell type matching the filter"
        $.n_tissues: "counts the top-N capped cross-tab, not every tissue matching the filter"
      files: [{path_from: $.output_path, must_exist: true, key_columns: [cell_type, tissue], write_once: true}]
    serve: pass

  get_expression_for_genes:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 200}, cellxgene_census.var: {access: upstream}}
    args:
      gene_symbols: {binds: cellxgene_census.var.feature_name, op: in, each: true, accepts: ["open_targets:hgnc_symbol"],
                     existence: upstream, send_as: label}
      output_path:  {role: output_path}
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns; without one upstream takes soma_joinid < max_cells"}
      layer:        {role: selector, values: {raw: cellxgene_census.anndata_outputs, normalized: cellxgene_census.anndata_outputs}}
      max_cells:    {role: limit, min: 1, max: 200000}
    # counted before upstream fetches; genes_found/genes_not_found recomputed from the file's var.feature_name
    # (upstream compares against var_names, which are positional digits in Census AnnData output)
    count_first: {table: cellxgene_census.obs, filter_arg: value_filter, genes_arg: gene_symbols,
                  max_cells_arg: max_cells, recompute_genes: true}
    result:
      kind: file
      rows: null
      summary_fields: {$.summary_stats: drop}    # over non-zero values of the truncated cells only
      files:
        - {path_from: $.output_path, must_exist: true, echo_checks: {n_obs: $.n_cells, n_vars: $.n_genes},
           key_columns: [soma_joinid], var_key_columns: [feature_id], write_once: true}
    serve: pass
    text:
      notes: ["without value_filter upstream keeps soma_joinid < max_cells: the first cells by join id, not a sample (disclosed in _vbt.scope)",
              "max_cells truncates the matching cells; the number truncated is disclosed"]
    defects:
      - {id: SC-004, what: "default value_filter soma_joinid < max_cells silently restricts the query to the first datasets",
         where: "single_cell_mcp/tools.py:883-885", test: test_dl_defect_detectors.py::test_sc_004, effect: silent_wrong}

  get_anndata_donor_balanced:
    reads: {cellxgene_census.obs: {access: upstream, est_row_bytes: 200}, cellxgene_census.var: {access: upstream}}
    args:
      output_path:  {role: output_path}
      value_filter: {role: free_text, interpreted_as: engine, escape: soma,
                     engine_doc: "SOMA value_filter over obs columns; it must fix one dataset_id (donor_id is unique only within a dataset)"}
      max_cells:    {role: limit, min: 1, max: 200000}
      gene_symbols: {binds: cellxgene_census.var.feature_name, op: in, each: true, accepts: ["open_targets:hgnc_symbol"],
                     existence: upstream, send_as: label}
      ensembl_ids:  {binds: cellxgene_census.var.feature_id, op: in, each: true, accepts: [census_feature], existence: upstream}
      obs_columns:  {role: family_param}           # passed as given (see the header: not a projection here)
      layer:        {role: selector, values: {raw: cellxgene_census.anndata_outputs, normalized: cellxgene_census.anndata_outputs}}
    count_first: {table: cellxgene_census.obs, filter_arg: value_filter, genes_arg: gene_symbols,
                  max_cells_arg: max_cells}
    requires_fixed:
      - {arg: value_filter, columns: [dataset_id], alternatives: [single_cell.get_anndata],
         reason: "donor_id is unique only within dataset_id; donors of different datasets would be balanced as one"}
    result:
      kind: file
      rows: null
      drop_fields:
        $.n_donors: "donor_id is unique only within dataset_id; donors of different datasets with one label merge"
        $.donor_summary: "keyed by donor_id alone, which merges donors of different datasets"
      files:
        - {path_from: $.output_path, must_exist: true, key_columns: [soma_joinid], var_key_columns: [feature_id],
           write_once: true}
    serve: pass
    text:
      notes: ["accepted only when value_filter fixes one dataset_id; otherwise unsupported_combination names single_cell.get_anndata",
              "'No cells found' is an unverified empty (the filter may name values absent from this Census release)"]
    defects:
      - {id: SC-001, what: "donor_id is grouped without dataset_id: donors of different datasets that share a label are balanced as one donor",
         where: "single_cell_mcp/tools.py:1096-1111", test: test_dl_defect_detectors.py::test_sc_001, effect: silent_wrong}
