# Overlay for the upstream pathway server (pathway_mcp; docs/DATA_LAYER.md §6.5, Appendix A).
# Phase 1: 3 pass, 5 derived, 2 block. Phase 3 (F16, F18): the two enrichment tools are derived from the
# member columns' enrichment contracts (full BH family, aspect-specific GO background, propagation over
# the Reactome and GO hierarchies), and find_genes_in_pathway propagates membership down the Reactome
# hierarchy: 3 pass, 7 derived, 0 block.
schema: vbt.overlay/1
server: pathway
sources: [open_targets]
upstream_commit: ${vars.upstream_commit:-71f9da68c95c5ee0ef4c1d9b8f45f10693de022d}   # the commit these bindings were reviewed against
tools:
  get_gene_pathways:
    reads: {open_targets.target: {access: projection, columns: [id, pathways]}}
    args:
      target_id: {binds: open_targets.target.id, accepts: [ensembl_gene, hgnc_symbol]}
    result:
      rows: $.pathways
      rows_of: open_targets.target_pathways
      parent_key: {id: $.target_id}
      fields:
        pathwayId:    {column: "pathways[].pathwayId"}
        pathway:      {column: "pathways[].pathway"}
        topLevelTerm: {column: "pathways[].topLevelTerm"}
      count_fields: [$.count]
      order: [{column: "pathways[].pathwayId", direction: asc}]
    serve: derived
    derived:
      verb: find
      table: open_targets.target_pathways
      rename: {"pathways[].pathwayId": pathwayId, "pathways[].pathway": pathway, "pathways[].topLevelTerm": topLevelTerm}
    text:
      notes: ["topLevelTerm is a lossy single label (a pathway can sit under several top-level pathways); the exact top-level ancestors come from pathway.get_pathway_info or mcp__data__expand (direction ancestors) on the Reactome hierarchy."]

  search_pathways:
    reads: {open_targets.target: {access: projection, columns: [id, pathways]}}
    args:
      query:          {role: free_text, binds_any: ["open_targets.target.pathways[].pathway", "open_targets.target.pathways[].pathwayId"],
                       interpreted_as: casefold_substring, pooled: true}   # 'cholesterol' lists 9 pathways
      top_level_term: {binds: "open_targets.target.pathways[].topLevelTerm", item_filter: true}
      limit:          {role: limit, min: 1, max: 5000}
    result:
      rows: $.pathways
      rows_of: open_targets.target_pathways
      grain: pathway
      fields:
        pathwayId:    {column: "pathways[].pathwayId"}
        pathway:      {column: "pathways[].pathway"}
        topLevelTerm: {column: "pathways[].topLevelTerm"}
        gene_count:   {computed: {agg: count_distinct, from: id, group_by: ["pathways[].pathwayId"]}}
      count_fields: [$.count]
      arg_echo: {limit: $.limit}
      order: [{column: gene_count, direction: desc}, {column: "pathways[].pathwayId", direction: asc}]
    serve: derived
    derived:
      verb: aggregate
      table: open_targets.target_pathways
      group_by: ["pathways[].pathwayId"]
      aggregate: {gene_count: {count_distinct: /id}, pathway: {first: "pathways[].pathway"},
                  topLevelTerm: {distinct: "pathways[].topLevelTerm"}}
      rename: {"pathways[].pathwayId": pathwayId}
    defects:
      - {id: OT-PATH-001, what: "topLevelTerm of a pathway is overwritten by its last occurrence, so the top-level filter misses pathways under two terms",
         where: "pathway_mcp/tools.py:149-153", effect: silent_wrong}

  get_gene_ontology:
    reads: {open_targets.target: {access: projection, columns: [id, go]}}
    args:
      target_id: {binds: open_targets.target.id, accepts: [ensembl_gene, hgnc_symbol]}
      aspect:    {binds: "open_targets.target.go[].aspect", item_filter: true,
                  send_map: {C: C, F: F, P: P}}          # aliases (biological_process -> P) resolve before sending
    result:
      rows: $.go_terms
      rows_of: open_targets.target_go
      parent_key: {/id: $.target_id}                  # go items have their own id
      count_fields: [$.count]
      order: [{column: "go[].id", direction: asc}]
    serve: derived
    derived:
      verb: find
      table: open_targets.target_go
      rename: {"go[].id": id, "go[].aspect": aspect, "go[].evidence": evidence, "go[].source": source,
               "go[].geneProduct": geneProduct, "go[].ecoId": ecoId}
    text: {drop_promises: [go_name]}
    defects:
      - {id: OT-PATH-003, what: "go is an ndarray: isinstance(go_terms, list) is False, so every gene returns count 0",
         where: "pathway_mcp/tools.py:236", test: test_dl_defect_detectors.py::test_ot_path_003, effect: false_empty}

  search_go_terms:
    reads: {open_targets.target: {access: projection, columns: [id, go]}, open_targets.go: {access: full_table}}
    args:
      query:  {role: free_text, binds_any: ["open_targets.target.go[].id"], interpreted_as: casefold_substring, pooled: true}
      aspect: {binds: "open_targets.target.go[].aspect", item_filter: true}
      limit:  {role: limit, min: 1, max: 5000}
    result:
      rows: $.go_terms
      rows_of: open_targets.target_go
      grain: term
      fields:
        goId:       {column: "go[].id"}
        aspect:     {column: "go[].aspect"}
        gene_count: {computed: {agg: count_distinct, from: id, group_by: ["go[].id"]}}
      count_fields: [$.count]
      arg_echo: {limit: $.limit}
      order: [{column: gene_count, direction: desc}, {column: "go[].id", direction: asc}]
    serve: derived
    derived:
      verb: aggregate
      table: open_targets.target_go
      group_by: ["go[].id", "go[].aspect"]
      aggregate: {gene_count: {count_distinct: /id}}
      rename: {"go[].id": goId, "go[].aspect": aspect}
    defects:
      - {id: OT-PATH-004, what: "go is an ndarray: isinstance(row['go'], list) is False, so every search returns no terms",
         where: "pathway_mcp/tools.py:287", effect: false_empty}

  find_genes_in_pathway:
    reads: {open_targets.target: {access: projection, columns: [id, pathways]}}
    args:
      pathway_id: {binds: "open_targets.target.pathways[].pathwayId", accepts: [reactome_pathway]}
    result:
      rows: $.genes
      rows_of: open_targets.target_pathways
      count_fields: {"$.gene_count": "len($.genes)"}
      order: [{column: id, direction: asc}]
    serve: derived
    # a higher-level pathway (564 Reactome IDs have no direct gene) lists the genes of its sub-pathways;
    # each gene once, with `via` naming the pathway it is annotated to (propagated membership, disclosed)
    derived: {verb: members, table: open_targets.target_pathways, columns: [id], split: {propagate: true},
              envelope: {pathway_id: "{pathway_id}", gene_count: null}}
    text:
      notes: ["Genes annotated to the pathway or to any of its sub-pathways (Reactome hierarchy); `via` names the pathway each gene is annotated to."]
    defects:
      - {id: OT-PATH-002, what: "a pathway with no annotated gene is reported as not found (an error), not as an empty membership",
         where: "pathway_mcp/tools.py:366-370", effect: error}

  get_pathway_enrichment:
    reads: {open_targets.target: {access: projection, columns: [id, approvedSymbol, pathways]},
            open_targets.reactome: {access: full_table}}
    args:
      gene_list:        {binds: open_targets.target.id, op: in, each: true, accepts: [ensembl_gene, hgnc_symbol],
                         on_missing: partial, min_resolved_fraction: 0.9}
      min_pathway_size: {role: family_param, min: 1}            # counted within the universe
      max_pathway_size: {role: family_param, min: 1}
      pvalue_threshold: {role: family_param, min: 0, max: 1}    # on the BH q-value (fdr), inclusive
      limit:            {role: limit, min: 1, max: 5000}
    witness: false                                 # rows are tested sets, not rows of target
    result:
      rows: $.enriched_pathways
      row_key: [pathwayId]
      # ordered by the handler: pvalue asc, then pathwayId (tested sets, not rows of target)
      count_fields: {"$.count": "len($.enriched_pathways)"}
      statistics: {test: hypergeom_enrichment, correction: fdr_bh, family: "every Reactome pathway within the size bounds, zero-overlap pathways included",
                   universe: "genes with at least one Reactome annotation"}
    serve: derived
    derived:
      verb: find
      table: open_targets.target
      # the enrich handler reads target.pathways' enrichment contract; upstream's enrichment_ratio
      # (overlap / pathway size) is not an enrichment ratio and is dropped (fold_enrichment is served)
      split:
        enrich: {column: pathways, args: {min_size: min_pathway_size, max_size: max_pathway_size, alpha: pvalue_threshold},
                 defaults: {min_size: 5, max_size: 500, alpha: 0.05}, drop: [expected]}
      rename: {set_id: pathwayId, set_label: pathway, set_size: pathway_size, overlap: overlap_count,
               overlap_members: overlap_genes, top_level: top_level_pathways}
      envelope: {count: null}                    # filled by count_fields
    text:
      drop_promises: [enrichment_ratio, topLevelTerm]
      notes:
        - "BH runs over every pathway within the size bounds (zero-overlap pathways included); the background is the genes with at least one Reactome annotation; annotations are propagated to ancestor pathways."
        - "top_level_pathways lists the exact top-level Reactome ancestors (topLevelTerm is a lossy single label)."
    defects:
      - {id: OT-PATH-005, what: "Benjamini-Hochberg m counts only pathways with at least one hit, so every q-value is too small",
         where: "pathway_mcp/tools.py:463-505", effect: silent_wrong}

  get_go_enrichment:
    reads: {open_targets.target: {access: projection, columns: [id, approvedSymbol, go]}, open_targets.go: {access: full_table}}
    args:
      gene_list:        {binds: open_targets.target.id, op: in, each: true, accepts: [ensembl_gene, hgnc_symbol],
                         on_missing: partial, min_resolved_fraction: 0.9}
      go_type:          {role: family_param,
                         values: {P: P, F: F, C: C, biological_process: P, molecular_function: F, cellular_component: C}}
      pvalue_threshold: {role: family_param, min: 0, max: 1}
      limit:            {role: limit, min: 1, max: 5000}
    witness: false
    result:
      rows: $.enriched_terms
      row_key: [go_aspect, go_id]
      # ordered by the handler: pvalue asc, then aspect and go_id
      count_fields: {"$.count": "len($.enriched_terms)"}
      statistics: {test: hypergeom_enrichment, correction: fdr_bh, family: "every GO term of the aspect within the size bounds, zero-overlap terms included",
                   universe: "genes with at least one GO annotation in the aspect"}
    serve: derived
    derived:
      verb: find
      table: open_targets.target
      split:
        enrich: {column: go, args: {aspect: go_type, alpha: pvalue_threshold}, defaults: {min_size: 3, alpha: 0.05},
                 drop: [expected, top_level]}
      rename: {set_id: go_id, set_label: go_name, scope: go_aspect, set_size: background_count, overlap: query_count,
               overlap_members: query_genes, fold_enrichment: enrichment_ratio}
      envelope: {count: null}
    text:
      notes:
        - "Each GO aspect has its own background (genes with an annotation in that aspect) and its own BH family; annotations propagate to ancestor terms over is_a and part_of (not regulates) when go-basic.obo is available."
        - "enrichment_ratio is the fold enrichment (observed / expected overlap)."
    defects:
      - {id: OT-PATH-006, what: "the background ignores the GO aspect and BH m counts only terms with a hit",
         where: "pathway_mcp/tools.py:770-800", effect: silent_wrong}

  get_go_term_info:
    reads: {open_targets.go: {access: full_table}}
    args:
      go_id: {binds: open_targets.go.id, accepts: [go_term]}       # obsolete terms resolve through the retired rule
    result:
      kind: record
      rows: $
      echo: {go_id: {path: $.id, source: record}}
      not_found_when: ["$.error =~ '(?i)not found'"]
    serve: pass

  get_pathway_info:
    reads: {open_targets.reactome: {access: full_table}}
    args:
      pathway_id: {binds: open_targets.reactome.id, accepts: [reactome_pathway]}
    result:
      kind: record
      rows: $
      echo: {pathway_id: {path: $.id, source: record}}
      trim:
        $.descendants: {max: 200, order: key}
        $.path: {max: 50, order: declared}
      not_found_when: ["$.error =~ '(?i)not found'"]
    serve: pass

  get_sequence_ontology_term:
    reads: {open_targets.so: {access: full_table}}
    args:
      so_id: {binds: open_targets.so.id, accepts: [so_term]}      # 'SO_0001583' normalised to SO:0001583; labels resolve
    result:
      kind: record
      rows: $
      echo: {so_id: {path: $.id, source: record}}
      not_found_when: ["$.error =~ '(?i)not found'"]
    serve: pass
