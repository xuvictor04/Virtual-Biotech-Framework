[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbt-harness"
version = "0.1.0"
description = "Provider-agnostic harness replicating 'The Virtual Biotech' multi-agent framework (Zhang et al., Science 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.26",
    "rich>=13",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
analysis = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyarrow>=16",
]
singlecell = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "harmonypy>=0.0.9",
    "pydeseq2>=0.4",
    "decoupler>=2.0",
    "liana>=1.5",
    "cellxgene-census>=1.15",
]
spatial = ["cell2location>=0.1.4"]
survival = ["lifelines>=0.29"]
r = ["rpy2>=3.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["vbt-harness[anthropic,analysis,singlecell,survival,dev]"]

[project.scripts]
vbt = "vbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vbt = ["prompts/**/*.md", "case_studies/**/*.md", "case_studies/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
