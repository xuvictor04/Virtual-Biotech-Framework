[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vbt-harness"
version = "0.1.0"
description = "Provider-agnostic harness replicating 'The Virtual Biotech' multi-agent framework (Zhang et al., Science 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "mcp>=1.26",
    "rich>=13",
]

[project.optional-dependencies]
# The default model is a LOCAL open-weight model (Qwen3.8-27B) behind an OpenAI-compatible server;
# the harness talks to it with httpx (a base dependency), so the base install needs no vendor SDK.
# Claude (`--profile claude` / `--profile paper`) needs the Anthropic SDK:
anthropic = ["anthropic>=1.0"]
# The inference server (vLLM >= 0.31, or SGLang / llama.cpp) runs separately - in its own
# environment or the vllm/vllm-openai docker image (`vbt local serve`, deploy/local/README.md) -
# because it pins its own torch/CUDA/transformers stack. Installing vllm into the harness env is
# not supported; this extra is intentionally empty and exists only as that pointer.
serve = []
# Everything the MCP data servers import (upstream FastMCP servers + the PubMed server).
# fastmcp: upstream pins 3.2.0; 4.x is tested with the harness bridge.
mcp = [
    "fastmcp>=3.2,<5",
    "mcp>=1.26",
    "pybioportal>=1.0",
    "pyarrow>=16",
    "pandas>=2.2",
    "requests>=2.31",
    "pronto>=2.5",
]
analysis = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
singlecell = [
    "anndata>=0.10",
    "scanpy>=1.10",
    "harmonypy>=0.0.9",
    "pydeseq2>=0.4",
    "decoupler>=2.0",
    "liana>=1.5",
    "cellxgene-census>=1.15",
    "gseapy>=1.1",
    "pronto>=2.5",
]
spatial = ["cell2location>=0.1.4"]
survival = ["lifelines>=0.29"]
r = ["rpy2>=3.5"]
# Read tool: images (downscaling) and PDF text; BulkDispatch JSON Schema validation.
tools = ["pillow>=10", "pypdf>=4", "jsonschema>=4"]
# `vbt web` (fig. S1 interface).
web = ["starlette>=0.37", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
all = ["vbt-harness[anthropic,mcp,analysis,singlecell,survival,tools,web,dev]"]
# all + R bridge (needs R with lme4/lmerTest/glmmTMB/betareg/MuMIn; see environment.yml) + Cell2Location.
full = ["vbt-harness[all,r,spatial]"]

[project.scripts]
vbt = "vbt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vbt = ["prompts/**/*.md", "case_studies/**/*.md", "case_studies/**/*.yaml", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
